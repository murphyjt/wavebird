name: Release

# Required secrets, stored in the `release` environment (deployment refs
# limited to `v*` tags — so workflow_dispatch only gets them with a tag ref):
#   APPLE_CERTIFICATE_P12_BASE64       — Developer ID Application cert (.p12) base64-encoded
#   APPLE_CERTIFICATE_PASSWORD         — password used when exporting the p12
#   APPLE_PROVISIONING_PROFILE_BASE64  — "WaveBird Developer ID G2" provisioning profile, base64-encoded
#   APPLE_TEAM_ID                      — 10-char team ID from developer.apple.com
#   APPLE_ID                           — Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD        — app-specific password from appleid.apple.com

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  # Everything that needs the Apple secrets. Only GitHub's actions and Apple's
  # tools run here; release notes and publishing happen in `publish` below.
  build:
    runs-on: macos-26
    environment: release
    permissions:
      contents: read
      id-token: write       # required by actions/attest
      attestations: write   # write the SLSA attestation
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # Apple's own `security` tool (the recipe in GitHub's "Installing an
      # Apple certificate on macOS runners" docs), so no third-party action
      # ever handles the .p12 or its password. -T + the partition list give
      # codesign access without -A's allow-everything.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/wavebird.provisionprofile"
          # Extract and print the profile name + UUID for verification.
          security cms -D -i "$PROFILE_DIR/wavebird.provisionprofile" \
            | plutil -extract Name xml1 -o - - \
            | xmllint --xpath '//string/text()' -

      - name: Build (Release, signed, hardened runtime)
        run: |
          xcodebuild \
            -project WaveBird.xcodeproj \
            -scheme WaveBird \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="WaveBird Developer ID G2" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            build

      - name: Re-sign with explicit entitlements
        run: |
          APP_PATH="build/Build/Products/Release/WaveBird.app"
          codesign --force \
            --sign "Developer ID Application" \
            --options runtime \
            --timestamp \
            --entitlements WaveBird/WaveBird.entitlements \
            "$APP_PATH"
          echo "Signed entitlements:"
          codesign -d --entitlements :- "$APP_PATH"

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/Build/Products/Release/WaveBird.app

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP_PATH="build/Build/Products/Release/WaveBird.app"
          ZIP_PATH="WaveBird.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          RESULT=$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait \
            --output-format json)
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | jq -r '.status')
          ID=$(echo "$RESULT" | jq -r '.id')
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::Notarization failed: $STATUS"
            echo "::group::Notarization log"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            echo "::endgroup::"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      - name: Stage app
        run: |
          mkdir -p dist dmg-root
          ditto build/Build/Products/Release/WaveBird.app dmg-root/WaveBird.app
          ln -s /Applications dmg-root/Applications

      # `diskutil image` ships with macOS (Apple's replacement for the hdiutil
      # verbs deprecated in macOS 27), so no third-party code runs in this job;
      # create-dmg came unpinned from Homebrew. The volume is APFS (readable on
      # 10.13+) and the Finder window uses default icon placement.
      - name: Build DMG
        run: |
          diskutil image create from \
            --format UDZO \
            --volumeName "WaveBird ${{ steps.version.outputs.version }}" \
            dmg-root \
            "dist/WaveBird-${{ steps.version.outputs.version }}.dmg"

      - name: Sign DMG
        run: |
          codesign --sign "Developer ID Application" --timestamp \
            "dist/WaveBird-${{ steps.version.outputs.version }}.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DMG="dist/WaveBird-${{ steps.version.outputs.version }}.dmg"
          RESULT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait \
            --output-format json)
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | jq -r '.status')
          ID=$(echo "$RESULT" | jq -r '.id')
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::DMG notarization failed: $STATUS"
            echo "::group::Notarization log"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            echo "::endgroup::"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          # attest-build-provenance set this when calling actions/attest.
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-path: dist/WaveBird-${{ steps.version.outputs.version }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WaveBird-${{ steps.version.outputs.version }}
          path: dist/WaveBird-${{ steps.version.outputs.version }}.dmg

  # Release notes and the GitHub Release, with no Apple secrets and no
  # signing environment: git-cliff (a downloaded binary) and gh only see the
  # finished, notarized DMG and a token limited to this repo's contents.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release + upload the DMG
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # git-cliff needs full history + tags
          persist-credentials: false

      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WaveBird-${{ needs.build.outputs.version }}
          path: dist

      - name: Determine changelog range
        id: changelog_range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_RELEASE=$(gh release list --limit 10 --exclude-drafts --json tagName \
            --jq '[.[] | select(.tagName != "${{ github.ref_name }}")][0].tagName' || true)
          if [[ -n "$PREV_RELEASE" ]]; then
            echo "args=${PREV_RELEASE}..${{ github.ref_name }} --strip header" >> "$GITHUB_OUTPUT"
          else
            echo "args=--strip header" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2   # the action's own default, written out
          config: cliff.toml
          args: ${{ steps.changelog_range.outputs.args }}
        env:
          OUTPUT: changelog.md

      - name: Compose release body
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          {
            cat changelog.md
            echo
            echo "<details><summary>Verify this build's provenance</summary>"
            echo
            echo '```sh'
            echo "gh attestation verify --repo ${REPO} WaveBird-${VERSION}.dmg"
            echo '```'
            echo "</details>"
            if [[ -n "$PREV_TAG" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-body.md
          echo "::group::release-body.md"
          cat release-body.md
          echo "::endgroup::"

      # gh is GitHub's own CLI, preinstalled on the runners. --verify-tag fails
      # instead of creating a missing tag; the title matches the old action's
      # default (the tag name). Re-running for a tag that already has a release
      # replaces its DMG and notes, as action-gh-release did.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DMG: dist/WaveBird-${{ needs.build.outputs.version }}.dmg
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-body.md
          else
            gh release create "$TAG" "$DMG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-body.md
          fi
